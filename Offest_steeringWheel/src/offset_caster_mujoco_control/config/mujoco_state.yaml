mujoco_state_node:
  ros__parameters:
    model_path: /workspace/3Dmodel/offestWheel/MJCF/offset_steering_wheel.xml
    publish_rate: 50.0
    command_timeout: 0.25
    enable_viewer: false

    wheel_radius: 0.075
    caster_offset: 0.105
    pivot_x: [0.5, 0.5, -0.5, -0.5]
    pivot_y: [0.35, -0.35, -0.35, 0.35]

    steering_joint_names:
      - steering_joint_1
      - steering_joint_2
      - steering_joint_3
      - steering_joint_4
    wheel_joint_names:
      - wheel_joint_1
      - wheel_joint_2
      - wheel_joint_3
      - wheel_joint_4
    steering_actuator_names:
      - steering_velocity_1
      - steering_velocity_2
      - steering_velocity_3
      - steering_velocity_4
    wheel_actuator_names:
      - wheel_velocity_1
      - wheel_velocity_2
      - wheel_velocity_3
      - wheel_velocity_4
