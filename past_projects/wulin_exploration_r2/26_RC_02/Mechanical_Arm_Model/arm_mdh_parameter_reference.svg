<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 1360 860">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #263238; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #263238; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #455a64; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #37474f; }
      .monoSmall { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #37474f; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #607d8b; }
      .grid { stroke: #d8e2e8; stroke-width: 1; }
      .panel { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.4; }
      .tableHead { fill: #eef5f9; stroke: #cfd8dc; stroke-width: 1; }
      .tableCell { fill: #ffffff; stroke: #d7e0e5; stroke-width: 1; }
      .axisLine { stroke: #607d8b; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .offset { stroke: #1e6091; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .component { stroke: #1e6091; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
      .link { stroke: #ef6c00; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .chord { stroke: #78909c; stroke-width: 2; fill: none; stroke-dasharray: 8 6; }
      .dim { stroke: #546e7a; stroke-width: 1.6; fill: none; marker-start: url(#arrowDim); marker-end: url(#arrowDim); }
      .joint { fill: #ffffff; stroke: #263238; stroke-width: 2.4; }
      .mdhPoint { fill: #e8f4ff; stroke: #1565c0; stroke-width: 2.2; }
      .vertex { fill: #fff4e5; stroke: #ef6c00; stroke-width: 2; }
      .axisX { stroke: #c62828; stroke-width: 2.5; marker-end: url(#arrowRed); }
      .axisY { stroke: #2e7d32; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .axisZ { stroke: #1565c0; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .axis4 { stroke-dasharray: 5 4; }
      .xText { fill: #c62828; font-family: Consolas, "Courier New", monospace; font-size: 13px; font-weight: 700; }
      .yText { fill: #2e7d32; font-family: Consolas, "Courier New", monospace; font-size: 13px; font-weight: 700; }
      .zText { fill: #1565c0; font-family: Consolas, "Courier New", monospace; font-size: 13px; font-weight: 700; }
      .outPos { fill: #ffffff; stroke-width: 2.1; }
      .outNeg { fill: #ffffff; stroke-width: 2.1; }
      .outX { stroke: #c62828; }
      .outY { stroke: #2e7d32; }
      .outZ { stroke: #1565c0; }
      .dotX { fill: #c62828; }
      .dotZ { fill: #1565c0; }
      .crossY { stroke: #2e7d32; stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1360" height="860" fill="#fbfdff"/>
  <text x="36" y="42" class="title">Corrected Mechanical Arm MDH Parameter Reference</text>
  <text x="36" y="66" class="small">Craig modified DH: T(i-1,i)=Rx(alpha(i-1))*Tx(a(i-1))*Rz(theta_i_mdh)*Tz(d_i). Zero pose uses theta1=theta2=theta3=0 deg.</text>

  <!-- Left diagram transform:
       screen_x = 150 + 1.12 * Y_mm
       screen_y = 740 - 1.12 * Z_mm

       O0/J1 physical = (0,0,0)                    -> (150.00, 740.00)
       O1_mdh         = (0,0,98.18)                -> (150.00, 630.04)
       O2/J2          = (0,42.64,98.18)            -> (197.76, 630.04)
       O3/O4/J3/J4    = (0,42.64,482.109445)       -> (197.76, 200.04)
       mirrored crank = (0,-1.312671,365.572476)   -> (148.53, 330.56)
  -->

  <g opacity="0.74">
    <line x1="150" y1="740" x2="500" y2="740" class="grid"/>
    <line x1="150" y1="628" x2="500" y2="628" class="grid"/>
    <line x1="150" y1="516" x2="500" y2="516" class="grid"/>
    <line x1="150" y1="404" x2="500" y2="404" class="grid"/>
    <line x1="150" y1="292" x2="500" y2="292" class="grid"/>
    <line x1="150" y1="180" x2="500" y2="180" class="grid"/>
    <line x1="150" y1="740" x2="150" y2="154" class="grid"/>
    <line x1="262" y1="740" x2="262" y2="154" class="grid"/>
    <line x1="374" y1="740" x2="374" y2="154" class="grid"/>
  </g>

  <line x1="150" y1="740" x2="505" y2="740" class="axisY"/>
  <line x1="150" y1="740" x2="150" y2="150" class="axisZ"/>
  <circle cx="118" cy="712" r="14" class="outPos outX"/>
  <circle cx="118" cy="712" r="4" class="dotX"/>
  <text x="512" y="745" class="yText">+X0 forward</text>
  <text x="125" y="148" class="zText">+Z0</text>
  <text x="80" y="694" class="xText">-Y0 out</text>

  <path d="M 150.00 740.00 L 197.76 630.04" class="offset"/>
  <path d="M 150.00 740.00 L 197.76 740.00 L 197.76 630.04" class="component"/>
  <path d="M 197.76 630.04 L 197.76 200.04" class="chord"/>
  <path d="M 197.76 630.04 L 148.53 330.56 L 197.76 200.04" class="link"/>

  <circle cx="150.00" cy="740.00" r="9" class="joint"/>
  <circle cx="150.00" cy="630.04" r="8" class="mdhPoint"/>
  <circle cx="197.76" cy="630.04" r="10" class="joint"/>
  <circle cx="197.76" cy="200.04" r="11" class="joint"/>
  <circle cx="148.53" cy="330.56" r="7" class="vertex"/>

  <text x="104" y="764" class="label">J1 physical / O0</text>
  <text x="92" y="614" class="label">O1</text>
  <text x="210" y="636" class="label">O2 / J2</text>
  <text x="210" y="206" class="label">O3=O4 / J3=J4</text>
  <text x="18" y="335" class="small">mirrored crank vertex</text>

  <line x1="150.00" y1="630.04" x2="197.76" y2="630.04" class="axisLine"/>
  <line x1="150.00" y1="740.00" x2="150.00" y2="630.04" class="axisLine"/>
  <text x="158" y="612" class="mono">a1=42.64</text>
  <text x="80" y="688" class="mono">d1=98.18</text>

  <path d="M 171 630.04 L 171 200.04" class="dim"/>
  <text x="68" y="424" class="mono" transform="rotate(-90 68 424)">a2=383.929445</text>
  <text x="22" y="468" class="mono">crank lengths: 270.98076211 / 124.55</text>

  <!-- Frame axes. -->
  <line x1="150" y1="630.04" x2="232" y2="630.04" class="axisX"/>
  <line x1="150" y1="630.04" x2="150" y2="548.04" class="axisZ"/>
  <circle cx="128" cy="660" r="13" class="outNeg outY"/>
  <line x1="119" y1="651" x2="137" y2="669" class="crossY"/>
  <line x1="137" y1="651" x2="119" y2="669" class="crossY"/>
  <text x="237" y="635" class="xText">X1</text>
  <text x="155" y="545" class="zText">Z1</text>
  <text x="88" y="682" class="yText">Y1</text>

  <line x1="190" y1="630.04" x2="190" y2="548.04" class="axisX"/>
  <line x1="197.76" y1="630.04" x2="115.76" y2="630.04" class="axisY"/>
  <circle cx="176" cy="660" r="13" class="outPos outZ"/>
  <circle cx="176" cy="660" r="4" class="dotZ"/>
  <text x="170" y="545" class="xText">X2</text>
  <text x="88" y="635" class="yText">Y2</text>
  <text x="140" y="682" class="zText">Z2</text>

  <line x1="197.76" y1="200.04" x2="115.76" y2="200.04" class="axisX"/>
  <line x1="206" y1="200.04" x2="206" y2="282.04" class="axisY"/>
  <circle cx="174" cy="231" r="13" class="outPos outZ"/>
  <circle cx="174" cy="231" r="4" class="dotZ"/>
  <text x="84" y="205" class="xText">X3</text>
  <text x="211" y="296" class="yText">Y3</text>
  <text x="138" y="252" class="zText">Z3</text>

  <circle cx="246" cy="231" r="13" class="outPos outX"/>
  <circle cx="246" cy="231" r="4" class="dotX"/>
  <line x1="216" y1="200.04" x2="298" y2="200.04" class="axisY axis4"/>
  <line x1="225" y1="200.04" x2="225" y2="118.04" class="axisZ axis4"/>
  <text x="255" y="252" class="xText">X4</text>
  <text x="303" y="205" class="yText">Y4</text>
  <text x="231" y="115" class="zText">Z4</text>

  <!-- Parameter table. -->
  <rect x="600" y="96" width="712" height="310" rx="6" class="panel"/>
  <text x="626" y="130" class="label">MDH parameter table</text>
  <text x="626" y="158" class="mono">theta_i_mdh is the angle used by the MDH transform, including zero-offsets.</text>

  <rect x="626" y="184" width="60" height="34" class="tableHead"/>
  <rect x="686" y="184" width="110" height="34" class="tableHead"/>
  <rect x="796" y="184" width="116" height="34" class="tableHead"/>
  <rect x="912" y="184" width="98" height="34" class="tableHead"/>
  <rect x="1010" y="184" width="82" height="34" class="tableHead"/>
  <rect x="1092" y="184" width="180" height="34" class="tableHead"/>
  <text x="646" y="205" class="mono">i</text>
  <text x="710" y="205" class="mono">frame</text>
  <text x="812" y="205" class="mono">alpha(i-1)</text>
  <text x="944" y="205" class="mono">a(i-1)</text>
  <text x="1030" y="205" class="mono">d_i</text>
  <text x="1120" y="205" class="mono">theta_i_mdh</text>

  <g>
    <rect x="626" y="218" width="60" height="38" class="tableCell"/>
    <rect x="686" y="218" width="110" height="38" class="tableCell"/>
    <rect x="796" y="218" width="116" height="38" class="tableCell"/>
    <rect x="912" y="218" width="98" height="38" class="tableCell"/>
    <rect x="1010" y="218" width="82" height="38" class="tableCell"/>
    <rect x="1092" y="218" width="180" height="38" class="tableCell"/>
    <text x="650" y="242" class="mono">1</text>
    <text x="710" y="242" class="mono">joint1</text>
    <text x="836" y="242" class="mono">0</text>
    <text x="948" y="242" class="mono">0</text>
    <text x="1026" y="242" class="mono">98.18</text>
    <text x="1112" y="242" class="mono">theta1 + pi/2</text>
  </g>
  <g>
    <rect x="626" y="256" width="60" height="38" class="tableCell"/>
    <rect x="686" y="256" width="110" height="38" class="tableCell"/>
    <rect x="796" y="256" width="116" height="38" class="tableCell"/>
    <rect x="912" y="256" width="98" height="38" class="tableCell"/>
    <rect x="1010" y="256" width="82" height="38" class="tableCell"/>
    <rect x="1092" y="256" width="180" height="38" class="tableCell"/>
    <text x="650" y="280" class="mono">2</text>
    <text x="710" y="280" class="mono">joint2</text>
    <text x="824" y="280" class="mono">pi/2</text>
    <text x="936" y="280" class="mono">42.64</text>
    <text x="1038" y="280" class="mono">0</text>
    <text x="1112" y="280" class="mono">theta2 + pi/2</text>
  </g>
  <g>
    <rect x="626" y="294" width="60" height="38" class="tableCell"/>
    <rect x="686" y="294" width="110" height="38" class="tableCell"/>
    <rect x="796" y="294" width="116" height="38" class="tableCell"/>
    <rect x="912" y="294" width="98" height="38" class="tableCell"/>
    <rect x="1010" y="294" width="82" height="38" class="tableCell"/>
    <rect x="1092" y="294" width="180" height="38" class="tableCell"/>
    <text x="650" y="318" class="mono">3</text>
    <text x="710" y="318" class="mono">joint3</text>
    <text x="836" y="318" class="mono">0</text>
    <text x="924" y="318" class="mono">383.929445</text>
    <text x="1038" y="318" class="mono">0</text>
    <text x="1112" y="318" class="mono">theta3 + pi/2</text>
  </g>
  <g>
    <rect x="626" y="332" width="60" height="38" class="tableCell"/>
    <rect x="686" y="332" width="110" height="38" class="tableCell"/>
    <rect x="796" y="332" width="116" height="38" class="tableCell"/>
    <rect x="912" y="332" width="98" height="38" class="tableCell"/>
    <rect x="1010" y="332" width="82" height="38" class="tableCell"/>
    <rect x="1092" y="332" width="180" height="38" class="tableCell"/>
    <text x="650" y="356" class="mono">4</text>
    <text x="710" y="356" class="mono">tool</text>
    <text x="824" y="356" class="mono">pi/2</text>
    <text x="948" y="356" class="mono">0</text>
    <text x="1038" y="356" class="mono">0</text>
    <text x="1132" y="356" class="mono">pi/2</text>
  </g>

  <!-- Check tables. -->
  <rect x="600" y="430" width="344" height="260" rx="6" class="panel"/>
  <text x="626" y="462" class="label">Zero-pose origins</text>
  <text x="626" y="494" class="mono">O0 = (0, 0, 0)</text>
  <text x="626" y="518" class="mono">O1 = (0, 0, 98.18)</text>
  <text x="626" y="542" class="mono">O2 = (42.64, 0, 98.18)</text>
  <text x="626" y="566" class="mono">O3 = (42.64, 0, 482.109445)</text>
  <text x="626" y="590" class="mono">O4 = O3</text>
  <text x="626" y="636" class="small">O1 is the MDH frame origin on z1; the physical joint1 center is O0.</text>

  <rect x="968" y="430" width="344" height="260" rx="6" class="panel"/>
  <text x="994" y="462" class="label">Zero-pose axes</text>
  <text x="994" y="494" class="monoSmall">1: X1=+X0, Y1=+Y0, Z1=+Z0</text>
  <text x="994" y="518" class="monoSmall">2: X2=+Z0, Y2=-X0, Z2=-Y0</text>
  <text x="994" y="542" class="monoSmall">3: X3=-X0, Y3=-Z0, Z3=-Y0</text>
  <text x="994" y="566" class="monoSmall">4: X4=-Y0, Y4=+X0, Z4=+Z0</text>
  <text x="994" y="612" class="small">x1, x2, x3 follow the Craig-MDH common-normal rule.</text>
  <text x="994" y="636" class="small">Frame 4 follows joint3 through a fixed transform.</text>

  <text x="36" y="826" class="note">This drawing is the current reference for comparing your MDH parameters. The crank has been mirrored about the Z0 direction; the MDH axes and joint origins are unchanged.</text>
</svg>
