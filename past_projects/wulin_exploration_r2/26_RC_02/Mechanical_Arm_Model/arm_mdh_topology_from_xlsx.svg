<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #263238; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #263238; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #455a64; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #37474f; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #607d8b; }
      .panel { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.4; }
      .link { stroke: #ef6c00; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .component { stroke: #607d8b; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrowDim); }
      .dim { stroke: #546e7a; stroke-width: 1.8; fill: none; stroke-dasharray: 4 4; }
      .joint { fill: #ffffff; stroke: #263238; stroke-width: 2.4; }
      .axisX { stroke: #c62828; stroke-width: 2.4; marker-end: url(#arrowRed); }
      .axisY { stroke: #2e7d32; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .axisZ { stroke: #1565c0; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .axisXTool { stroke: #c62828; stroke-width: 2.2; stroke-dasharray: 5 4; marker-end: url(#arrowRed); }
      .axisYTool { stroke: #2e7d32; stroke-width: 2.2; stroke-dasharray: 5 4; marker-end: url(#arrowGreen); }
      .axisZTool { stroke: #1565c0; stroke-width: 2.2; stroke-dasharray: 5 4; marker-end: url(#arrowBlue); }
      .xText { fill: #c62828; font-family: Consolas, "Courier New", monospace; font-size: 13px; font-weight: 700; }
      .yText { fill: #2e7d32; font-family: Consolas, "Courier New", monospace; font-size: 13px; font-weight: 700; }
      .zText { fill: #1565c0; font-family: Consolas, "Courier New", monospace; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="760" fill="#fbfdff"/>
  <text x="36" y="42" class="title">Legacy MDH Topology From XLSX Table, Zero Pose</text>
  <text x="36" y="66" class="small">Canonical frame: X0 forward, Y0 left, Z0 up. XLSX values are rotated into this frame.</text>

  <!-- Projection used for this drawing:
       screen_x = 100 + 1.1 * (Y + 0.60 * X)
       screen_y = 660 - 1.1 * (Z - 0.35 * X)

       Craig MDH:
       T(i-1,i) = Rx(alpha(i-1)) Tx(a(i-1)) Rz(theta(i)) Tz(d(i))

       XLSX rows, with theta1=theta2=theta3=0:
       1: alpha0=0,    a0=0,        d1=262.5, theta=theta1+PI/2
       2: alpha1=PI/2, a1=42.64,    d2=98.18, theta=theta2
       3: alpha2=0,    a2=383.9294, d3=0,     theta=theta3+PI/2
       4: alpha3=PI/2, a3=0,        d4=0,     theta=PI
  -->

  <!-- Main topology links. -->
  <path d="M 100 660 L 100 371.25 L 211.70 409.05 L 634.03 409.05" class="link"/>

  <!-- MDH component hints. -->
  <path d="M 100 371.25 L 146.90 371.25" class="component"/>
  <path d="M 146.90 371.25 L 211.70 409.05" class="component"/>
  <path d="M 211.70 409.05 L 634.03 409.05" class="component"/>
  <text x="112" y="352" class="mono">a1=42.64 along X1 (+X0)</text>
  <text x="160" y="391" class="mono">d2=98.18 along Z2 (-Y0)</text>
  <text x="360" y="392" class="mono">a2=383.9294 along X2 / J2->J3</text>
  <text x="48" y="507" class="mono">d1=262.5</text>

  <!-- Joints. -->
  <circle cx="100" cy="660" r="8" class="joint"/>
  <circle cx="100" cy="371.25" r="9" class="joint"/>
  <circle cx="211.70" cy="409.05" r="9" class="joint"/>
  <circle cx="634.03" cy="409.05" r="10" class="joint"/>

  <text x="68" y="684" class="label">{0} world</text>
  <text x="62" y="356" class="label">{1} joint1</text>
  <text x="195" y="432" class="label">{2} joint2</text>
  <text x="616" y="432" class="label">{3} joint3</text>
  <text x="646" y="392" class="label">{T}/{4} tool, origin=joint3</text>

  <!-- World frame axes at O0. -->
  <line x1="100" y1="660" x2="152.80" y2="690.80" class="axisX"/>
  <line x1="100" y1="660" x2="188.00" y2="660.00" class="axisY"/>
  <line x1="100" y1="660" x2="100.00" y2="572.00" class="axisZ"/>
  <text x="158" y="700" class="xText">X0</text>
  <text x="194" y="665" class="yText">Y0</text>
  <text x="78" y="568" class="zText">Z0</text>

  <!-- Frame 1 axes: X1=+X0, Y1=+Y0, Z1=+Z0. -->
  <line x1="100" y1="371.25" x2="188.00" y2="371.25" class="axisX"/>
  <line x1="100" y1="371.25" x2="47.20" y2="340.45" class="axisY"/>
  <line x1="100" y1="371.25" x2="100.00" y2="283.25" class="axisZ"/>
  <text x="191" y="376" class="xText">X1</text>
  <text x="18" y="338" class="yText">Y1</text>
  <text x="105" y="280" class="zText">Z1</text>

  <!-- Frame 2 axes: X2=+X0, Y2=+Z0, Z2=-Y0. -->
  <line x1="211.70" y1="409.05" x2="299.70" y2="409.05" class="axisX"/>
  <line x1="211.70" y1="409.05" x2="211.70" y2="321.05" class="axisY"/>
  <line x1="211.70" y1="409.05" x2="264.50" y2="439.85" class="axisZ"/>
  <text x="303" y="414" class="xText">X2</text>
  <text x="217" y="318" class="yText">Y2</text>
  <text x="270" y="449" class="zText">Z2</text>

  <!-- Frame 3 axes: X3=+Z0, Y3=-X0, Z3=-Y0. -->
  <line x1="634.03" y1="409.05" x2="634.03" y2="321.05" class="axisX"/>
  <line x1="634.03" y1="409.05" x2="546.03" y2="409.05" class="axisY"/>
  <line x1="634.03" y1="409.05" x2="686.83" y2="439.85" class="axisZ"/>
  <text x="640" y="318" class="xText">X3</text>
  <text x="518" y="414" class="yText">Y3</text>
  <text x="692" y="449" class="zText">Z3</text>

  <!-- Legacy XLSX tool frame axes: X4=-Z0, Y4=+Y0, Z4=+X0.
       Superseded for the corrected physical zero by arm_poweron_zero_topology_axes.svg.
  -->
  <line x1="634.03" y1="409.05" x2="634.03" y2="497.05" class="axisXTool"/>
  <line x1="634.03" y1="409.05" x2="581.23" y2="378.25" class="axisYTool"/>
  <line x1="634.03" y1="409.05" x2="722.03" y2="409.05" class="axisZTool"/>
  <text x="639" y="512" class="xText">X4 old</text>
  <text x="548" y="375" class="yText">Y4 old</text>
  <text x="728" y="414" class="zText">Z4 old</text>

  <!-- Right-side verification panel. -->
  <rect x="760" y="92" width="382" height="560" rx="6" class="panel"/>
  <text x="784" y="122" class="label">XLSX MDH rows</text>
  <text x="784" y="150" class="mono">i  alpha(i-1)  a(i-1)    d(i)    theta(i)</text>
  <text x="784" y="176" class="mono">1  0           0         262.5   theta1+PI/2</text>
  <text x="784" y="198" class="mono">2  PI/2        42.64      98.18  theta2</text>
  <text x="784" y="220" class="mono">3  0           383.9294   0      theta3+PI/2</text>
  <text x="784" y="242" class="mono">4  PI/2        0          0      PI</text>

  <text x="784" y="284" class="label">Frame origins from table</text>
  <text x="784" y="312" class="mono">O0 = (0, 0, 0)</text>
  <text x="784" y="334" class="mono">O1 = (0, 0, 262.5)</text>
  <text x="784" y="356" class="mono">O2 = (42.64, -98.18, 262.5)</text>
  <text x="784" y="378" class="mono">O3 = (426.5694, -98.18, 262.5)</text>
  <text x="784" y="400" class="mono">OT = O3</text>

  <text x="784" y="442" class="label">Axis directions at zero pose</text>
  <text x="784" y="470" class="mono">joint1: X1=+X0, Y1=+Y0, Z1=+Z0</text>
  <text x="784" y="492" class="mono">joint2: X2=+X0, Y2=+Z0, Z2=-Y0</text>
  <text x="784" y="514" class="mono">joint3: X3=+Z0, Y3=-X0, Z3=-Y0</text>
  <text x="784" y="536" class="mono">tool old: X4=-Z0, Y4=+Y0, Z4=+X0</text>

  <text x="784" y="586" class="label">Check point</text>
  <text x="784" y="614" class="mono">The table makes d2=98.18 move along Z2,</text>
  <text x="784" y="636" class="mono">so it becomes a -Y0 offset in this pose.</text>

  <text x="36" y="726" class="note">Important: this legacy figure is drawn directly from the XLSX table. Use arm_poweron_zero_topology_axes.svg for the corrected physical zero and tool frame.</text>
</svg>
