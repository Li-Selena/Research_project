<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e6091"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
    <style>
      .axis { stroke: #263238; stroke-width: 2.2; marker-end: url(#arrow); }
      .grid { stroke: #d8e2e8; stroke-width: 1; }
      .offset { stroke: #1e6091; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .component { stroke: #1e6091; stroke-width: 1.8; stroke-dasharray: 5 5; fill: none; }
      .link { stroke: #d95f02; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .chord { stroke: #78909c; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
      .dim { stroke: #546e7a; stroke-width: 1.8; fill: none; marker-start: url(#arrowDim); marker-end: url(#arrowDim); }
      .angle { stroke: #7b1fa2; stroke-width: 2; fill: none; }
      .joint { fill: #ffffff; stroke: #263238; stroke-width: 2.4; }
      .apex { fill: #fff4e5; stroke: #d95f02; stroke-width: 2; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #263238; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #455a64; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #263238; }
      .math { font-family: Consolas, "Courier New", monospace; font-size: 14px; fill: #37474f; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #607d8b; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="720" fill="#fbfdff"/>
  <text x="38" y="44" class="title">3-DOF Arm Topology in Robot OXZ Plane</text>
  <text x="38" y="68" class="small">FLU robot frame: +X forward, +Y left, +Z up. This drawing is on y = 0.</text>

  <!-- Coordinate transform used in this drawing:
       svg_x = 110 + 1.4 * Y_mm
       svg_y = 650 - 1.4 * Z_mm
       J1 = (Y=0, Z=0)
       J2 = (Y=42.64, Z=98.18)
       For topology only, the J2-J3 endpoint chord is placed along +Y.
       J3 = (Y=426.569445, Z=98.18)
       Apex = (Y=310.032476, Z=142.132671)
  -->

  <!-- Light grid in the OYZ plane. -->
  <g opacity="0.78">
    <line x1="110" y1="650" x2="840" y2="650" class="grid"/>
    <line x1="110" y1="580" x2="840" y2="580" class="grid"/>
    <line x1="110" y1="510" x2="840" y2="510" class="grid"/>
    <line x1="110" y1="440" x2="840" y2="440" class="grid"/>
    <line x1="110" y1="370" x2="840" y2="370" class="grid"/>
    <line x1="110" y1="300" x2="840" y2="300" class="grid"/>
    <line x1="110" y1="230" x2="840" y2="230" class="grid"/>
    <line x1="110" y1="650" x2="110" y2="220" class="grid"/>
    <line x1="250" y1="650" x2="250" y2="220" class="grid"/>
    <line x1="390" y1="650" x2="390" y2="220" class="grid"/>
    <line x1="530" y1="650" x2="530" y2="220" class="grid"/>
    <line x1="670" y1="650" x2="670" y2="220" class="grid"/>
    <line x1="810" y1="650" x2="810" y2="220" class="grid"/>
  </g>

  <!-- Axes. -->
  <line x1="110" y1="650" x2="845" y2="650" class="axis"/>
  <line x1="110" y1="650" x2="110" y2="210" class="axis"/>
  <text x="852" y="655" class="label">+X forward</text>
  <text x="82" y="205" class="label">+Z up</text>
  <text x="123" y="674" class="small">O = joint1, yaw axis is +Z</text>

  <!-- J1 to J2 offset. -->
  <path d="M 110 650 L 169.696 512.548" class="offset"/>
  <path d="M 110 650 L 169.696 650 L 169.696 512.548" class="component"/>
  <text x="191" y="591" class="math">J2 offset = (x=42.64, y=0, z=98.18) mm</text>
  <text x="130" y="668" class="math">x=0, z=0</text>
  <text x="177" y="658" class="math">42.64</text>
  <text x="177" y="567" class="math">98.18</text>

  <!-- Convex link topology. -->
  <path d="M 169.696 512.548 L 544.045 451.014 L 707.197 512.548" class="link"/>
  <path d="M 169.696 512.548 L 707.197 512.548" class="chord"/>

  <!-- Dimension lines. -->
  <path d="M 177 535 L 699 535" class="dim"/>
  <text x="343" y="558" class="math">J2-J3 endpoint distance = 383.929445 mm</text>
  <path d="M 238 481 L 475 442" class="dim"/>
  <text x="267" y="431" class="math">270.98076211 mm</text>
  <path d="M 584 455 L 692 495" class="dim"/>
  <text x="620" y="443" class="math">124.55 mm</text>

  <!-- Included angle at the convex vertex. -->
  <path d="M 508 457 A 38 38 0 0 0 579 465" class="angle"/>
  <text x="524" y="435" class="math">150 deg</text>

  <!-- Joint and vertex markers. -->
  <circle cx="110" cy="650" r="8" class="joint"/>
  <circle cx="169.696" cy="512.548" r="10" class="joint"/>
  <circle cx="707.197" cy="512.548" r="10" class="joint"/>
  <circle cx="544.045" cy="451.014" r="7" class="apex"/>

  <text x="72" y="641" class="label">joint1</text>
  <text x="145" y="493" class="label">joint2</text>
  <text x="686" y="493" class="label">joint3</text>
  <text x="557" y="452" class="small">convex link vertex</text>

  <!-- Rotation axis annotations. -->
  <text x="38" y="100" class="math">joint1: theta1 about yaw axis (+Z)</text>
  <text x="38" y="122" class="math">joint2: theta2 about roll axis (+/-Y, normal to this plane)</text>
  <text x="38" y="144" class="math">joint3: theta3 about roll axis (+/-Y, normal to this plane)</text>

  <!-- Out-of-plane cue for +X. -->
  <circle cx="794" cy="284" r="16" fill="#ffffff" stroke="#263238" stroke-width="1.8"/>
  <circle cx="794" cy="284" r="4" fill="#263238"/>
  <text x="820" y="289" class="small">-Y right, out of OXZ plane</text>

  <!-- Assumption note. -->
  <text x="38" y="700" class="note">Note: The J2-J3 chord is drawn along +X only to show topology and dimensions. A true zero pose needs the theta2/theta3 reference directions.</text>
</svg>
